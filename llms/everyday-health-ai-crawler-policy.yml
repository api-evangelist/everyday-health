summary: 'Everyday Health publishes no AI-use policy page. Its AI and agent posture is stated entirely in robots.txt,
  which is unusually explicit: a licensing preamble asserting Ziff Davis terms, a blanket Disallow for 107 named
  AI/agent user-agents, and a separately generated 2,764-URL selective block for Google-Extended. This is the structured
  reading of that document; the document itself is saved verbatim alongside it.'
